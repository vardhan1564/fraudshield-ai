# Transaction model training (spec 03 sections 1, 5, 6).
# python -m ml.pipelines.train --dataset simulated|ieee  (the flag overrides `dataset`)
dataset: simulated
seed: 42
split: { train: 0.70, val: 0.15, test: 0.15 } # by time, never random
target_fpr: 0.01 # HOLD threshold: FPR <= 1% on validation (spec 03 section 5)

mlflow:
  experiment: txn_model # tracking URI comes from MLFLOW_TRACKING_URI in .env

datasets:
  simulated:
    features: ml/data/features/simulated.parquet # from python -m ml.features.build
    raw_dir: ml/data/simulated # used to build the features if the file is missing
    warmup_days: 14 # features see these days, training doesn't (users need history first)
  ieee:
    raw_dir: ml/data/raw/ieee
    max_rows: null # e.g. 300000 to train on the earliest rows if memory is short

xgboost:
  num_boost_round: 2000
  early_stopping_rounds: 100 # on validation PR-AUC
  params:
    eta: 0.05
    max_depth: 6
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
    max_bin: 256
    eval_metric: aucpr

# Anomaly model (T2.3): trained on legit rows only, behaviour + device + velocity features.
anomaly:
  isolation_forest: { n_estimators: 200, max_samples: 256 }
  autoencoder:
    hidden: [8, 4] # encoder sizes; the decoder mirrors them
    epochs: 50
    patience: 5 # early stopping on validation-legit loss
    batch_size: 512
    lr: 0.001
  mlflow_experiment: anomaly_model

# Social-engineering model (T2.4): LightGBM on context, payee, coach and amount-ratio features.
social:
  scenarios: [digital_arrest, fake_support_refund, investment_task] # target = 1
  step_up_fpr: 0.05 # STEP_UP range: first-pass score above the 5%-FPR threshold (spec 03 section 5)
  coach_share: 0.5 # share of STEP_UP-range training rows that get simulated coach answers
  coach_questions: [2, 3] # spec 01 F1: 2-3 yes/no questions
  coach_yes: { scam: 0.6, other_fraud: 0.05, legit: 0.03 } # chance of a red-flag YES per question
  # Turning one of these on may never lower the score (spec 01 F2: a call must raise risk).
  monotone_increasing: [ctx_unknown_call, ctx_screen_share, ctx_call_long, coach_red_flags]
  lightgbm:
    num_boost_round: 2000
    early_stopping_rounds: 100
    params:
      learning_rate: 0.05
      num_leaves: 31
      min_data_in_leaf: 50
      feature_fraction: 0.9
      bagging_fraction: 0.8
      bagging_freq: 1
  mlflow_experiment: social_model

# Meta-model (T2.5): isotonic-calibrated logistic regression on the model scores.
meta:
  hold_fpr: 0.01 # HOLD threshold: FPR <= 1% on validation (spec 03 section 5)
  step_up_fpr: 0.05 # STEP_UP threshold: FPR <= 5% on validation
  unknown_call_boost: 0.25 # spec 01 F2 rule: unknown call + new payee adds this to risk_score
  f2_max_base_risk: 0.8 # F2 check counts payments whose risk without the call is <= this
  mlflow_experiment: meta_model
