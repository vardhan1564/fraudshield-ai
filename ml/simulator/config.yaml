# UPI simulator settings (docs/specs/03-ml-spec.md section 4).
# CLI flags --n, --users and --seed override n_transactions, n_users and seed.
seed: 42
n_transactions: 100000 # total rows in transactions.parquet
n_users: 10000 # ordinary customers (mule accounts are added on top)
start: "2026-07-01T00:00:00+05:30"
days: 90

# Share of all transaction rows per injected scenario (mule rings are set below instead).
shares:
  digital_arrest: 0.004
  fake_support_refund: 0.003
  investment_task: 0.003
  account_takeover: 0.002
  card_testing: 0.002

# Mule rings. Numbers are chosen so the rule detectors in spec 01 F3 can fire.
rings:
  count: 20
  min_size: 10 # mule accounts per ring
  max_size: 30
  victims_per_collector: [22, 35] # fan-in: > 20 distinct senders in 24 h
  forward_share: [0.85, 0.97] # pass-through: > 80% forwarded within 1 h
  new_account_share: 0.5 # mules opened < 7 days before the ring starts
  accounts_per_device: 3 # shared device: >= 3 accounts on one phone

normal:
  repeat_payee_share: 0.70
  failed_share: 0.03
  payees_per_user: [3, 15]
  off_hours_share: 0.10 # payments outside the user's usual hours
  channel_mix: { UPI: 0.80, CARD: 0.12, WALLET: 0.08 }

# Legit rows that look risky, as a share of normal rows (label in hard_negative).
hard_negatives:
  big_legit: 0.005 # rent / fees, 10-40x the user's average
  new_payee_legit: 0.005 # first payment to a new merchant, 3-10x average
  night_legit: 0.005 # 00:00-04:59
  call_legit: 0.005 # on a long call with someone in contacts

# Realism: legit look-alikes and scam variety, so no single signal gives fraud away.
realism:
  new_merchant_share: 0.15 # shops opened in the last 90 days
  new_customer_share: 0.15 # customers who joined in the last 90 days (young P2P payees)
  aged_scam_payee_share: 0.4 # scam payees on old "rented" accounts (180-2000 days)
  legit_on_call: 0.08 # normal payments made during a phone call
  legit_unknown_caller: 0.25 # of those, the caller is not in contacts (delivery, bank, ...)
  legit_screen_share: 0.01 # sharing the screen with family or office IT
  legit_remote_app: 0.003 # AnyDesk etc. open for work
  digital_arrest_screen_share: 0.85 # not every victim is asked to share the screen
  legit_new_phone_users: 0.03 # customers who switch to a new phone during the window

# Merchant categories: how often a merchant has the category, and amount vs the user's average.
merchant_categories:
  GROCERY: { weight: 0.22, amount_mult: 0.6 }
  FOOD: { weight: 0.18, amount_mult: 0.4 }
  FUEL: { weight: 0.10, amount_mult: 1.0 }
  UTILITIES: { weight: 0.10, amount_mult: 1.5 }
  ECOMMERCE: { weight: 0.15, amount_mult: 1.5 }
  TRAVEL: { weight: 0.05, amount_mult: 3.0 }
  ENTERTAINMENT: { weight: 0.07, amount_mult: 0.8 }
  HEALTH: { weight: 0.05, amount_mult: 2.0 }
  EDUCATION: { weight: 0.04, amount_mult: 6.0 }
  RENT: { weight: 0.04, amount_mult: 8.0 }
p2p_amount_mult: 1.0

